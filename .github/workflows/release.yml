name: Release

on:
  push:
    tags: ["v*"]
    # Pushing to the `release` branch also publishes, tagged with the app version (v<package version>).
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  # Tag push → its name; manual run → v<version>; `release` branch → v<app version> (tauri-action creates the tag).
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version)) || 'v__VERSION__' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Musicfree ${{ env.TAG }}"
          releaseBody: |
            ## Download

            | Sistema | Arquivo |
            |---|---|
            | Windows 10/11 | `Musicfree_*_x64-setup.exe` (instalador em português) |
            | macOS (Intel e Apple Silicon) | `Musicfree_*_universal.dmg` |
            | Linux | `.AppImage` (qualquer distro) ou `.deb` (Debian/Ubuntu) |

            Os instaladores ainda não são assinados digitalmente. Na primeira execução, o Windows
            SmartScreen mostra "Mais informações → Executar assim mesmo"; no macOS, clique com o
            botão direito no app e escolha **Abrir**. Veja o README para mais detalhes.
          releaseDraft: false
          prerelease: false
          # Builds the release from the commit that triggered the run.
          releaseCommitish: ${{ github.sha }}
          args: ${{ matrix.args }}
